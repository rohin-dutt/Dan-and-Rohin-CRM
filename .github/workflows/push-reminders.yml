name: Send Push Reminders
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call push reminders API
        run: |
          curl -X POST https://useroots.app/api/mobile/send-push-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
