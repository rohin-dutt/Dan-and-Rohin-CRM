name: Send Push Reminders
on:
  schedule:
    # Every 30 minutes; the job itself decides which timezones are inside
    # their deterministic 5pm-8pm local send slot on each run.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call push reminders API
        run: |
          curl -v -X POST https://useroots.app/api/mobile/send-push-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
